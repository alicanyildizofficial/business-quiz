<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="robots" content="noindex">
<title>Host — Business Quiz</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/host.css">
</head>
<body>
<div class="host-wrap">

  <div class="host-top">
    <div class="brand" style="margin:0">
      <div class="brand-mark">BP</div>
      <div class="brand-text">
        <div class="brand-title">Business Quiz</div>
        <div class="brand-sub">The Business Partner AI</div>
      </div>
    </div>
    <div class="host-stats">
      <div class="host-stat"><div class="v" id="h-players">0</div><div class="k">Yarışmacı</div></div>
      <div class="host-stat"><div class="v" id="h-answered">0</div><div class="k">Cevaplayan</div></div>
      <div class="host-stat"><div class="v" id="h-pos">—</div><div class="k">Soru</div></div>
      <div class="host-stat"><div class="v" id="h-leads">0</div><div class="k">Lead</div></div>
    </div>
  </div>

  <div class="host-body">

    <!-- Lobi -->
    <section id="h-lobby" class="screen active">
      <div class="pin-hero">
        <div class="pin-label">Oyun PIN'i</div>
        <div class="pin-value" id="h-pin">······</div>
        <div class="pin-url" id="h-url">planpartner.tech</div>
        <div class="pin-hint">Telefonundan adresi aç, PIN'i gir, adını yaz.</div>
        <div class="joined" id="h-joined"></div>
      </div>
    </section>

    <!-- Soru / Sonuç -->
    <section id="h-question" class="screen host-q">
      <div class="host-timer">
        <div class="num" id="h-left">20</div>
        <div class="bar"><div class="fill" id="h-fill"></div></div>
      </div>
      <div class="host-qtext" id="h-qtext"></div>
      <div class="host-choices" id="h-choices"></div>
      <div class="host-note" id="h-note"></div>
    </section>

    <!-- Final -->
    <section id="h-final" class="screen">
      <div class="host-final">
        <div>
          <h1>Kazananlar</h1>
          <ul class="rank" id="h-podium"></ul>
        </div>
        <div>
          <div class="card">
            <h2>Etkinlik özeti</h2>
            <div class="statline">
              <div class="stat"><div class="stat-v" id="f-players">0</div><div class="stat-k">Katılımcı</div></div>
              <div class="stat"><div class="stat-v" id="f-leads">0</div><div class="stat-k">Lead</div></div>
            </div>
            <button class="ghost" id="h-csv">Lead'leri CSV indir</button>
          </div>
        </div>
      </div>
    </section>

  </div>

  <div class="host-actions">
    <button id="h-main">Başlat</button>
    <div class="spacer"></div>
    <button class="ghost small" id="h-reset">Yeni oyun</button>
  </div>

</div>
<script src="/host.js"></script>
</body>
</html>
